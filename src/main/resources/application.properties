spring.application.name=symph

# ===== DATABASE (MySQL) =====
# Uses Render environment variables. Falls back to localhost for local testing.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/symph?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Password reset email (optional) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL used to build the reset link in the email.
app.frontend.base-url=${APP_BASE_URL:http://localhost:8080}

# ===== Demo-only features =====
app.demo.reset-enabled=${DEMO_RESET_ENABLED:false}

# Server port
server.port=${PORT:8080}