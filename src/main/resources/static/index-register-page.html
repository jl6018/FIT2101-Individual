<!--
    Register Page — Symph Web Application
    Provides the account creation form for new users. Includes fields for
    name, email, password, and role (Employee, Product Owner, or Admin),
    plus an error banner and a link back to the login page.

    @author Lim Jia Li
    @version 17.0.16
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symph — Register</title>
    <link rel="stylesheet" href="style-register-page.css">
</head>
<body>

<div class="login-wrap">
    <div class="logo"><img src="images/symph-logo.png" alt="Symph" /></div>
    <h1>Create your account</h1>

    <div class="card">
        <div class="error-banner" id="errorBanner">
            <span id="errorText"></span>
            <button class="close-x" id="dismissError" aria-label="Dismiss error">✕</button>
        </div>

        <form id="registerForm" novalidate>
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Please enter your name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@company.com" required
                       pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(com|org|net|edu|gov|mil|io|co|my|sg|uk|us|info|biz|dev|app)$"
                       title="Please enter a valid email with a recognized domain (e.g. user@gmail.com)">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
            </div>

            <div class="field">
                <label for="role">Role</label>
                <select id="role" name="role" style="width:100%;padding:12px 14px;border-radius:10px;border:none;">
                    <option value="EMPLOYEE">Employee</option>
                    <option value="PRODUCT_OWNER">Product Owner</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <button type="submit" class="submit" id="registerBtn">Register</button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:14px;">
            Already have an account? <a href="index-login-page.html">Log in</a>
        </p>
    </div>
</div>

<script src="main-register-page.js" type="module" defer></script>
</body>
</html>
