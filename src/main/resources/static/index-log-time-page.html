<!--
    Log Time Page — Symph Web Application
    Displays a modal for recording work hours against a task, including
    date, start time, and time spent. The overlay is shown immediately
    on page load.

    @author Lim Jia Li
    @version 17.0.16
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Symph — Log Time</title>
    <link rel="stylesheet" href="style-log-time-page.css">

    <!-- Prevent caching so the form always loads fresh -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

<!-- ===================== MODAL: Log Time ===================== -->
<div class="modal-overlay visible" id="logTimeOverlay">
    <div class="modal modal-user" role="dialog" aria-modal="true">
        <button class="modal-close" id="closeLogTimeBtn" aria-label="Close">✕</button>
        <h2 class="modal-title">Log Time</h2>
        <p class="modal-subtitle">Record your start time, time spent, and date.</p>

        <!-- Time logging form -->
        <form id="logTimeForm">
            <div class="form-field">
                <label for="logDate">Date</label>
                <input type="date" id="logDate" name="logDate" required>
            </div>

            <div class="form-field">
                <label for="logStartTime">Start time</label>
                <input type="time" id="logStartTime" name="logStartTime" required>
            </div>

            <div class="form-field">
                <label for="logHours">Time spent (hours)</label>
                <input type="number" id="logHours" name="logHours" step="0.5" min="0.5" required>
            </div>

            <button type="submit" class="btn-primary full-width">Save log</button>
        </form>
    </div>
</div>

<script src="main-log-time-page.js" type="module" defer></script>
</body>
</html>
