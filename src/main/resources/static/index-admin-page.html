<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Board</title>

    <link rel="stylesheet" href="style-admin-page.css"/>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
<nav class="navbar">
    <div class="logo">SYMPH</div>
    <div class="search-bar">
        <input type="text" placeholder="Search" />
        <span class="search-icon">🔍</span>
    </div>
    <div class="navbar-icons">
        <span>📢</span>
        <span>🔔</span>
        <div class="avatar avatar-dark">U</div>
        <button id="logoutBtn" class="logout-btn">Log out</button>
    </div>
</nav>

<header class="project-header">
    <div class="project-header-left">
        <a href="index-sprint-board-page.html" class="back-btn" title="Back to Sprint Board">← Back</a>
        <h1>Project Name</h1>
        <span class="badge">Admin</span>
    </div>
    <div class="project-header-right">
        <button class="start-sprint-btn" id="startSprintBtn">▶ Start Sprint</button>
        <select id="adminTeamSwitcher" class="admin-team-switcher">
            <option value="all">All Teams</option>
            <option value="Team Alpha">Team Alpha</option>
            <option value="Team Beta">Team Beta</option>
            <option value="Team Gamma">Team Gamma</option>
        </select>
        <div class="avatar-stack">
            <div class="avatar avatar-teal">T</div>
            <div class="avatar avatar-pink">H</div>
            <div class="avatar avatar-gray">B</div>
            <span class="avatar-more">+2</span>
        </div>
        <button class="share-btn">👤+ Share</button>
        <span class="menu-dots">⋯</span>
    </div>
</header>

<div class="sprint-tabs">
    <button class="sprint-tab active" data-sprint="1">Sprint 1</button>
    <button class="sprint-tab" data-sprint="2">Sprint 2</button>
    <button class="sprint-tab" data-sprint="3">Sprint 3</button>
</div>

<main class="board" id="board"></main>

<!-- ===================== MODAL: Logout ===================== -->
<div class="modal-overlay" id="logoutOverlay">
    <div class="modal modal-narrow" role="dialog" aria-modal="true">
        <h2 class="modal-title">Log out?</h2>
        <p class="modal-subtitle">You'll be returned to the login page.</p>
        <div class="modal-actions">
            <button id="cancelLogoutBtn" class="btn-secondary">Cancel</button>
            <button id="confirmLogoutBtn" class="btn-danger">Log out</button>
        </div>
    </div>
</div>

<script type="module" src="main-admin-page.js" defer></script>
</body>
</html>
