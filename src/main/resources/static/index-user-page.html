<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symph — User Board</title>

    <link rel="stylesheet" href="style-user-page.css"/>

    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

<nav class="navbar">
    <div class="logo"><img src="images/symph-logo.png" alt="Symph" /></div>
    <div class="search-bar">
        <input type="text" placeholder="Search" />
        <span class="search-icon">🔍</span>
    </div>
    <div class="navbar-icons">
        <span>📢</span>
        <span>🔔</span>
        <span id="signedInName" style="font-size: 0.85rem; margin-right: 8px;">Employee</span>
        <div class="avatar avatar-dark">U</div>
        <button id="logoutBtn" class="logout-btn">Log out</button>
    </div>
</nav>

<header class="project-header">
    <div class="project-header-left">
        <h1>Project Name</h1>
    </div>
    <div class="project-header-right">
        <div class="avatar-stack">
            <div class="avatar avatar-teal">T</div>
            <div class="avatar avatar-pink">H</div>
            <div class="avatar avatar-gray">B</div>
            <span class="avatar-more">+2</span>
        </div>
        <button class="share-btn">👤+ Share</button>
        <span class="menu-dots">⋯</span>
    </div>
</header>

<div class="sprint-tabs">
    <button class="sprint-tab active" data-sprint="1">Sprint 1</button>
    <button class="sprint-tab" data-sprint="2">Sprint 2</button>
    <button class="sprint-tab" data-sprint="3">Sprint 3</button>
</div>

<main class="board" id="board"></main>

<!-- ===================== MODAL: View task (read-only, admin-style) ===================== -->
<div class="modal-overlay" id="taskModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Task details">
        <div class="modal-header">
            <select class="pill pill-select" id="modalColumn" disabled>
                <option value="PRODUCT_BACKLOG">Product Backlog</option>
                <option value="TO_DO">To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="IN_REVIEW">In Review</option>
                <option value="COMPLETED">Completed</option>
            </select>
            <div class="modal-header-icons">
                <span class="modal-dots">⋯</span>
                <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Close">✕</button>
            </div>
        </div>

        <div class="modal-body">
            <div class="modal-title-row">
                <span class="modal-title-dot"></span>
                <input class="modal-title-input" id="modalTitle" type="text" readonly />
            </div>

            <div class="modal-toolbar">
                <div class="toolbar-group">
                    <button class="pill" type="button" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                        Dates
                    </button>
                    <button class="pill" type="button" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg>
                        Estimate
                    </button>
                    <button class="pill" type="button" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
                        Members
                    </button>
                </div>
            </div>

            <div class="modal-summary" id="modalSummary"></div>

            <section class="modal-section">
                <h3>Description</h3>
                <textarea class="modal-description" id="modalDescription" readonly placeholder="No description"></textarea>
            </section>

            <div class="modal-footer">
                <button class="modal-cancel-btn" id="modalCancelBtn" type="button">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- ===================== MODAL: Logout ===================== -->
<div class="modal-overlay" id="logoutOverlay">
    <div class="modal modal-narrow" role="dialog" aria-modal="true">
        <h2 class="modal-title">Log out?</h2>
        <p class="modal-subtitle">You'll be returned to the login page.</p>
        <div class="modal-actions">
            <button id="cancelLogoutBtn" class="btn-secondary">Cancel</button>
            <button id="confirmLogoutBtn" class="btn-danger">Log out</button>
        </div>
    </div>
</div>

<script type="module" src="main-user-page.js" defer></script>
</body>
</html>
