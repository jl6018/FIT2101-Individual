<!--
    User Board Page — Symph Web Application
    Kanban board for employees. Includes search, tag filter, sprint tabs,
    a read-only task modal, a Log Time modal (US24), a "My Logs" modal
    (opened from the ⋯ menu in the project header), and an account menu on
    the avatar with Log out.

    @author Lim Jia Li
    @version 17.0.16
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symph — User Board</title>

    <link rel="stylesheet" href="style-user-page.css"/>

    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

<nav class="navbar">
    <div class="logo"><img src="images/symph-logo.png" alt="Symph" /></div>

    <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search" aria-label="Search tasks" />

        <div class="tag-filter">
            <button id="tagFilterBtn" class="team-filter-btn" type="button" aria-haspopup="true"
                    aria-expanded="false" title="Filter by tag">
                <span id="tagFilterLabel">All tags</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 12l-8 8-9-9V4h7l10 8z"/>
                    <circle cx="7.5" cy="7.5" r="1.2"/>
                </svg>
            </button>
            <div class="popover team-filter-menu" id="tagFilterMenu" role="menu"></div>
        </div>
    </div>

    <div class="navbar-icons">
        <div class="account-menu-wrap">
            <button id="profileMenuBtn" class="account-menu-btn" type="button"
                    aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
                <div class="avatar avatar-dark" id="userAvatar">?</div>
            </button>
            <div class="account-menu" id="profileMenu" role="menu">
                <div class="account-menu-header">
                    <div class="account-menu-name" id="profileMenuName">Employee</div>
                    <div class="account-menu-sub" id="profileMenuSub">—</div>
                </div>
                <button type="button" class="account-menu-item" id="logoutBtn" role="menuitem">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 12H3M11 7l5 5-5 5"/>
                        <path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/>
                    </svg>
                    Log out
                </button>
            </div>
        </div>
    </div>
</nav>

<header class="project-header">
    <div class="project-header-left">
        <h1>Project Name</h1>
    </div>
    <div class="project-header-right">
        <div class="more-menu-wrap">
            <button id="headerMenuBtn" class="more-menu-btn" type="button"
                    aria-haspopup="true" aria-expanded="false" aria-label="More options">⋯</button>
            <div class="more-menu" id="headerMenu" role="menu">
                <button type="button" class="more-menu-item" id="myLogsBtn" role="menuitem">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="8.5"/>
                        <path d="M12 7.5V12l3 2"/>
                    </svg>
                    My Logs
                </button>
            </div>
        </div>
    </div>
</header>

<div class="sprint-tabs">
    <button class="sprint-tab active" data-sprint="1">Sprint 1</button>
    <button class="sprint-tab" data-sprint="2">Sprint 2</button>
    <button class="sprint-tab" data-sprint="3">Sprint 3</button>
</div>

<p id="boardEmptyState" class="board-empty" style="display:none;">
    You have no tasks assigned yet. Please contact your admin.
</p>

<main class="board" id="board"></main>

<div class="modal-overlay" id="taskModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Task details">
        <div class="modal-header">
            <select class="pill pill-select" id="modalColumn" disabled>
                <option value="PRODUCT_BACKLOG">Product Backlog</option>
                <option value="TO_DO">To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="IN_REVIEW">In Review</option>
                <option value="COMPLETED">Completed</option>
            </select>
            <div class="modal-header-icons">
                <span class="modal-dots">⋯</span>
                <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Close">✕</button>
            </div>
        </div>

        <div class="modal-body">
            <div class="modal-title-row">
                <span class="modal-title-dot"></span>
                <input class="modal-title-input" id="modalTitle" type="text" readonly />
            </div>

            <div class="modal-toolbar">
                <div class="toolbar-group">
                    <button class="pill" type="button" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                        Dates
                    </button>
                    <button class="pill" type="button" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg>
                        Estimate
                    </button>
                    <button class="pill" type="button" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
                        Members
                    </button>
                </div>
            </div>

            <div class="modal-summary" id="modalSummary"></div>

            <section class="modal-section">
                <h3>Description</h3>
                <textarea class="modal-description" id="modalDescription" readonly placeholder="No description"></textarea>
            </section>

            <div class="modal-footer">
                <button class="modal-cancel-btn" id="modalCancelBtn" type="button">Close</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="logTimeOverlay">
    <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="logTimeTitle">
        <button class="modal-close" id="closeLogTimeBtn" aria-label="Close" type="button">✕</button>
        <h2 class="modal-title" id="logTimeTitle">Log Time</h2>
        <p class="modal-subtitle" id="logTimeTaskContext">Record your start time, time spent, and date.</p>

        <div class="error-banner" id="logTimeError" role="alert" hidden>
            <span id="logTimeErrorText"></span>
        </div>

        <form id="logTimeForm">
            <div class="form-field">
                <label for="logDate">Date</label>
                <input type="date" id="logDate" name="logDate" required>
            </div>
            <div class="form-field">
                <label for="logStartTime">Start time</label>
                <input type="time" id="logStartTime" name="logStartTime" required>
            </div>
            <div class="form-field">
                <label for="logHours">Time spent (hours)</label>
                <input type="number" id="logHours" name="logHours" step="0.5" min="0.5" required>
            </div>
            <div class="form-field">
                <label for="logDescription">What did you work on? (optional)</label>
                <input type="text" id="logDescription" name="logDescription" maxlength="200"
                       placeholder="e.g. Fixed login bug">
            </div>
            <button type="submit" class="btn-primary full-width" id="logTimeSubmitBtn">Save log</button>
        </form>
    </div>
</div>

<div class="modal-overlay" id="myLogsOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="myLogsTitle">
        <button class="modal-close" id="closeMyLogsBtn" aria-label="Close" type="button">✕</button>
        <h2 class="modal-title" id="myLogsTitle">My Logged Time</h2>
        <p class="modal-subtitle" id="myLogsSubtitle">Every time entry you've recorded. Click ✕ to delete a mistake.</p>

        <div class="my-logs-table-wrap">
            <table class="my-logs-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Task</th>
                    <th>Hours</th>
                    <th>Description</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="myLogsBody">
                <tr><td colspan="5" class="muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>

        <p class="my-logs-total" id="myLogsTotal"></p>
    </div>
</div>

<script type="module" src="main-user-page.js" defer></script>
</body>
</html>
