<!--
    Forgot / Reset Password Page — Symph Web Application
    Self-service reset: the user enters their email and a new password.
    No email delivery required — the backend updates the password directly.

    @author Lim Jia Li
    @version 17.0.16
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symph — Reset Password</title>
    <link rel="stylesheet" href="style-login-page.css">
</head>
<body>

<div class="login-wrap">
    <div class="logo"><img src="images/symph-logo.png" alt="Symph" /></div>
    <h1>Reset your password</h1>

    <div class="card">
        <div class="error-banner" id="errorBanner">
            <span id="errorText"></span>
            <button class="close-x" id="dismissError" aria-label="Dismiss">✕</button>
        </div>

        <div class="success-banner" id="successBanner" hidden>
            <span id="successText"></span>
        </div>

        <form id="forgotForm" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                       placeholder="you@company.com" autocomplete="email">
            </div>

            <div class="field">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword"
                       placeholder="At least 8 characters" autocomplete="new-password">
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Re-type the new password" autocomplete="new-password">
            </div>

            <p class="forgot-help">
                Password must be at least 8 characters and contain at least one letter and one number.
            </p>

            <button type="submit" class="submit" id="submitBtn">Reset password</button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:14px;">
            Remembered it? <a href="index-login-page.html">Back to login</a>
        </p>
    </div>
</div>

<script src="main-forgot-password-page.js" defer></script>
</body>
</html>
