<!--
    Login Page — Symph Web Application
    Provides the sign-in form for existing users. Includes an error banner
    for invalid credentials, a "no invitation" modal for uninvited Product
    Owners, a "Forgot password?" link, and a link to the registration page.

    @author Lim Jia Li
    @version 17.0.16
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symph — Login</title>
    <link rel="stylesheet" href="style-login-page.css">
</head>

<body>

<div class="login-wrap">
    <div class="logo"><img src="images/symph-logo.png" alt="Symph" /></div>
    <h1>Welcome to Symph</h1>

    <div class="card">
        <div class="error-banner" id="errorBanner">
            <span id="errorText">Incorrect email or password.</span>
            <button class="close-x" id="dismissError" aria-label="Dismiss error">✕</button>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="userId">Email Address</label>
                <input type="email" id="userId" name="userId" placeholder="Please enter your email address"
                       autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Please enter your password"
                       autocomplete="current-password">
            </div>

            <p class="forgot-link-row">
                <a href="index-forgot-password-page.html">Forgot password?</a>
            </p>

            <button type="submit" class="submit" id="submitBtn">Log in</button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:14px;">
            Don't have an account? <a href="index-register-page.html">Register</a>
        </p>
    </div>
</div>

<!-- ===================== MODAL: No Invitation ===================== -->
<div class="modal-overlay" id="noInviteOverlay">
    <div class="modal modal-narrow" role="dialog" aria-modal="true">
        <h2 class="modal-title">No invitation found</h2>
        <p class="modal-subtitle">
            You don't have an invitation to this product. Please ask an admin
            to invite <strong id="noInviteEmail">your email</strong> before
            logging in as a Product Owner.
        </p>
        <div class="modal-actions">
            <button id="logoutNoInviteBtn" class="btn-primary full-width" type="button">Log out</button>
        </div>
    </div>
</div>

<script src="main-login-page.js" type="module" defer></script>
</body>

</html>
