<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symph — Team Management</title>
    <link rel="stylesheet" href="style-team-management-page.css">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>

<body>

<div class="app-shell">
    <aside class="sidebar">
        <a class="logo" href="index-admin-page.html">
            <img src="images/symph-logo.png" alt="Symph" />
        </a>

        <nav class="nav">
            <a href="index-admin-page.html" class="nav-item">
                <span class="dot"></span> Sprint Board
            </a>
            <a href="index-sprint-planning-page.html" class="nav-item">
                <span class="dot"></span> Sprint Planning
            </a>
            <a href="index-team-management-page.html" class="nav-item active">
                <span class="dot dot-active"></span> Team Management
            </a>
            <a href="index-reports-page.html" class="nav-item">
                <span class="dot"></span> Reports
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="signed-in">Signed in as <strong id="signedInName">Admin</strong></div>
            <button id="logoutBtn" class="switch-account-btn">Log out</button>
        </div>
    </aside>

    <main class="main">
        <h1>Team Management</h1>

        <div class="action-row">
            <button id="addMemberBtn" class="btn-primary">+ Add member</button>
        </div>

        <table class="members-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Job Title</th>
                <th>Team</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="membersBody"></tbody>
        </table>
    </main>
</div>

<!-- ===================== MODAL: Add Member ===================== -->
<div class="modal-overlay" id="addMemberOverlay">
    <div class="modal" role="dialog" aria-modal="true">
        <button class="modal-close" id="closeAddMemberBtn" aria-label="Close">✕</button>
        <h2 class="modal-title">Add Member</h2>

        <form id="addMemberForm">
            <div class="form-field">
                <label for="memberUser">Select user</label>
                <select id="memberUser" name="memberUser" required>
                    <option value="">Select a user...</option>
                </select>
            </div>

            <div class="form-field">
                <label for="memberJobTitle">Job Title</label>
                <select id="memberJobTitle" name="memberJobTitle" required>
                    <option value="">Select a job title...</option>
                    <option value="Frontend Developer">Frontend Developer</option>
                    <option value="Backend Developer">Backend Developer</option>
                    <option value="QA Tester">QA Tester</option>
                    <option value="Scrum Master">Scrum Master</option>
                    <option value="Product Owner">Product Owner</option>
                    <option value="Git Manager">Git Manager</option>
                    <option value="Business Analyst">Business Analyst</option>
                </select>
            </div>

            <div class="form-field">
                <label for="memberTeam">Team</label>
                <select id="memberTeam" name="memberTeam" required>
                    <option value="">Select a team...</option>
                    <option value="Team Alpha">Team Alpha</option>
                    <option value="Team Beta">Team Beta</option>
                    <option value="Team Gamma">Team Gamma</option>
                </select>
            </div>

            <button type="submit" class="btn-primary full-width">Add member</button>
        </form>
    </div>
</div>

<!-- ===================== MODAL: Remove Member ===================== -->
<div class="modal-overlay" id="removeMemberOverlay">
    <div class="modal modal-narrow" role="dialog" aria-modal="true">
        <h2 class="modal-title">Remove <span id="removeMemberName"></span>?</h2>
        <p class="modal-subtitle">They'll lose access to <span id="removeMemberTeam"></span>'s board immediately.</p>

        <div class="modal-actions">
            <button id="cancelRemoveBtn" class="btn-secondary">Cancel</button>
            <button id="confirmRemoveBtn" class="btn-danger">Remove member</button>
        </div>
    </div>
</div>

<!-- ===================== MODAL: Logout ===================== -->
<div class="modal-overlay" id="logoutOverlay">
    <div class="modal modal-narrow" role="dialog" aria-modal="true">
        <h2 class="modal-title">Log out?</h2>
        <p class="modal-subtitle">You'll need to sign in again to access the board.</p>

        <div class="modal-actions">
            <button id="cancelLogoutBtn" class="btn-secondary">Cancel</button>
            <button id="confirmLogoutBtn" class="btn-danger">Log out</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="main-team-management-page.js" type="module" defer></script>
</body>

</html>
