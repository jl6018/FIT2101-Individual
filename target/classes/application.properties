spring.application.name=symph

# Database ? reads from env vars, falls back to local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/symph}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=abc123

# Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Password reset email (optional) =====
# Leave MAIL_USER blank for dev ? reset links will print to the console.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL used to build the reset link in the email.
# In production, set APP_BASE_URL to your deployed domain.
app.frontend.base-url=${APP_BASE_URL:http://localhost:8081}

# Server port
server.port=${PORT:8081}